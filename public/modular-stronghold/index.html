<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stronghold Modular Kit</title><style>
*{box-sizing:border-box}body{margin:0;background:#11191f;color:#eee7d7;font:14px system-ui}header{height:64px;display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid #3b4a55}h1{font-size:18px;margin:0}button,select,a{background:#23313b;color:#eee7d7;border:1px solid #51616c;padding:7px 10px;border-radius:4px;cursor:pointer}header small{flex:1;color:#bac4ca}.app{display:grid;grid-template-columns:260px 1fr;height:calc(100dvh - 64px)}aside{overflow:auto;border-right:1px solid #3b4a55;padding:12px}#assets{display:grid;grid-template-columns:1fr 1fr;gap:8px}#assets button{padding:4px;font-size:11px}#assets button[aria-pressed=true]{border-color:#ffce7a;background:#4c4432}#assets img{width:100%;height:85px;object-fit:contain;background:repeating-conic-gradient(#1d2830 0% 25%,#26323b 0% 50%) 0/16px 16px}main{position:relative;min-width:0}canvas{display:block;width:100%;height:100%;touch-action:none}#status{position:absolute;bottom:12px;left:12px;background:#111d26e8;padding:8px;border-radius:4px;pointer-events:none}p{font-size:12px;line-height:1.5;color:#bfc9cf}@media(max-width:700px){.app{grid-template-columns:150px 1fr}header{height:auto;flex-wrap:wrap;padding:8px}.app{height:calc(100dvh - 110px)}header small{display:none}#assets{grid-template-columns:1fr}}
</style><header><h1>Stronghold · Modular Kit</h1><small>Paint tiles · Place props · Pan across an unbounded grid</small><select id="mode" aria-label="Tool"><option value="pan">Pan</option><option value="place">Place asset</option><option value="erase">Erase</option></select><button id="grid">Grid</button><button id="reset">Reset camera</button><button id="export">Export layout</button><a href="kit.zip" download>Download kit</a><a href="/stronghold.html">Game</a></header><div class="app"><aside><p>Choose an asset, then click the world to place it. Pan with the Pan tool or right-drag. Scroll to zoom. Ground tiles snap to the 128 × 64 grid.</p><div id="assets"></div></aside><main><canvas aria-label="Infinite modular terrain editor"></canvas><div id="status">Loading assets…</div></main></div><script type="module" src="editor.js"></script></html>
