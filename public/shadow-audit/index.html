<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Shadow geometry audit</title><style>body{font:16px system-ui;background:#141b24;color:#e6ecf4;max-width:1100px;margin:24px auto;padding:16px}select,input{padding:8px;background:#263340;color:inherit}canvas{width:100%;background:#b9c7cf;border:1px solid #789}pre{white-space:pre-wrap}label{display:inline-block;margin:8px}a{color:#b9d5ff}</style><h1>Shadow geometry audit</h1><p>Explicit billboard proxies preserve original atlas alpha. This inspector does not demonstrate object shadow reception or measured volumetric depth.</p><label>Family <select id="family"></select></label><label>Mirror <input id="mirror" type="checkbox"></label><label>Sun X <input id="sun" type="range" min="-1.7" max="1.7" step=".05" value="1"></label><canvas width="1100" height="650"></canvas><pre id="details"></pre><p><a href="inventory.json">Frame-level inventory and dispositions</a> · <a href="companions.json">Generated geometry companions</a></p><script type="module">
const c=await fetch('companions.json').then(r=>r.json()), inv=await fetch('inventory.json').then(r=>r.json()), sel=document.querySelector('#family'), mirror=document.querySelector('#mirror'), sun=document.querySelector('#sun'), canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
const atlas=new Image();atlas.src=c.atlas;await atlas.decode();for(const id of Object.keys(c.assets)){const op=document.createElement('option');op.value=op.textContent=id;sel.append(op)}sel.value='grave-headstone';if(!sel.value)sel.selectedIndex=0;
function draw(){const id=sel.value,p=c.assets[id],r=inv.rows.find(r=>r.id==='frontier:'+id),[fx,fy,fw,fh]=p.frame,k=Math.min(2.2,420/fw,450/fh),sx=k*(mirror.checked?-1:1),dx=+sun.value,dy=.45,n=p.ground.length-1,x=550,y=530;ctx.clearRect(0,0,1100,650);const at=a=>{const t=Math.max(0,Math.min(n,a/fw*n)),i=Math.min(n-1,Math.floor(t));return (n?p.ground[i]+(p.ground[i+1]-p.ground[i])*(t-i):p.ground[0])*fh};
ctx.save();ctx.fillStyle='#14202c';ctx.globalAlpha=.38;
// Same original alpha, split at each companion baseline segment; visual diagnostic only.
const shade=document.createElement('canvas');shade.width=1100;shade.height=650;const g=shade.getContext('2d');if(p.model==='constant-height-slab'){g.setTransform(sx,0,0,k,x+dx*p.heightPx*k,y+(1+dy)*p.heightPx*k);g.drawImage(atlas,fx,fy,fw,fh,-p.pivot[0]*fw,-p.pivot[1]*fh,fw,fh)}else for(let i=0;i<n;i++){const a=Math.round(fw*i/n),b=Math.round(fw*(i+1)/n),base=at(a),m=(at(b)-base)/Math.max(1,b-a);g.setTransform(sx+dx*k*m,k*m*(1+dy),-dx*k,-dy*k,x+sx*(a-p.pivot[0]*fw)+dx*k*base,y+k*(base-p.pivot[1]*fh)+dy*k*base);g.drawImage(atlas,fx+a,fy,b-a,fh,0,0,b-a,fh)}g.setTransform(1,0,0,1,0,0);g.globalCompositeOperation='source-in';g.fillStyle='#14202c';g.fillRect(0,0,1100,650);ctx.drawImage(shade,0,0);ctx.restore();ctx.save();ctx.translate(x,y);ctx.scale(sx,k);ctx.drawImage(atlas,fx,fy,fw,fh,-p.pivot[0]*fw,-p.pivot[1]*fh,fw,fh);ctx.strokeStyle='#ed4141';ctx.lineWidth=2/k;ctx.beginPath();for(let i=0;i<=n;i++){const a=fw*i/n,b=p.ground[i]*fh;i?ctx.lineTo(a-p.pivot[0]*fw,b-p.pivot[1]*fh):ctx.moveTo(a-p.pivot[0]*fw,b-p.pivot[1]*fh)}ctx.stroke();ctx.restore();document.querySelector('#details').textContent=JSON.stringify({family:id,model:p.model,frame:p.frame,pivot:p.pivot,cast:r.cast,receive:r.receive,disposition:r.disposition,warning:'Red line = proxy baseline, not measured 3D depth. Inspector uses 16 segments; production retains existing per-family strip counts.'},null,2)}sel.onchange=mirror.onchange=sun.oninput=draw;draw();
</script></html>
