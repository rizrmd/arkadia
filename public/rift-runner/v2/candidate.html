<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rift Runner candidate animation review</title><style>html{color-scheme:dark;background:#121b23;color:#e5edf2;font:15px system-ui}body{max-width:1200px;margin:24px auto;padding:16px}p{line-height:1.6;color:#bbcad3}a{color:#7bdded}button,select{font:inherit;padding:8px;background:#263842;color:white;border:1px solid #58717e;border-radius:5px}label{margin-right:12px}.notice{border-left:3px solid #e9b673;padding:12px;background:#30291f}#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(256px,1fr));gap:12px}article{padding:12px;border:1px solid #40535d;border-radius:8px;background:#1b2830}h2{font-size:16px}canvas{width:100%;max-width:256px;background:repeating-conic-gradient(#29363e 0% 25%,#1b252b 0% 50%) 50%/24px 24px}small{color:#aac1cf}</style><h1>Rift Runner · Candidate playback</h1><p class="notice">Controlled-source candidates under verification. The complete idle/run, four-skill and separate VFX acceptance is still open. Current successful checks do not make the unfinished collection game-ready.</p><p><a href="./">Source prototype</a> · <a href="candidate-manifest.json">Frame and socket manifest</a></p><label>Action <select id="action"></select></label><label>Mode <select id="mode"><option value="once">Play once and hold</option><option value="repeat">Repeat clip for review</option><option value="transition">Neutral → action → neutral</option></select></label><button id="pause">Pause</button> <button id="step">Next frame</button><label><input id="sockets" type="checkbox" checked> Ground pivot and muzzle guides</label><p id="status">Loading…</p><div id="grid"></div><script type="module">
const $=s=>document.querySelector(s),manifest=await fetch(new URLSearchParams(location.search).get('manifest')||'candidate-manifest.json').then(r=>r.json()),sprites=new Map();await Promise.all(manifest.sheets.map(async sheet=>{const image=new Image();image.src=sheet.image;await image.decode();for(const clip of sheet.clips)await Promise.all(clip.frames.map(async(frame,n)=>{const b=frame.alphaBounds,cell=sheet.cell[0];const bitmap=await createImageBitmap(image,frame.cell[0]*cell+b[0],frame.cell[1]*cell+b[1],b[2]-b[0],b[3]-b[1]);sprites.set(clip.id+':'+n,{bitmap,left:b[0],top:b[1]})}));image.src=''}));for(const a of manifest.actions)$('#action').add(new Option(a,a));let time=0,last=null,playing=true,seen=new Set(),phases=new Set(),trace=[];const clips=()=>manifest.clips.filter(c=>c.id.startsWith($('#action').value+'-'));function rebuild(){if($('#action').value==='death')$('#mode').value='once';else $('#mode').value='repeat';const g=$('#grid');g.replaceChildren();for(const c of clips()){const a=document.createElement('article');a.innerHTML=`<h2>${c.direction}</h2><canvas width="320" height="320"></canvas><small></small>`;g.append(a)}time=0;last=null;seen.clear();phases.clear();trace=[];draw()}
function draw(){for(const [i,c]of clips().entries()){let frame=$('#mode').value==='once'?Math.min(c.frames.length-1,Math.floor(time*c.fps)):Math.floor(time*c.fps)%c.frames.length,phase='action';if(c.holdLastFrame&&$('#mode').value==='once'&&time>=c.duration)phase='terminal hold';if($('#mode').value==='transition'&&!c.loop){const cycle=c.holdLastFrame?time:time%(c.duration+1.2);if(cycle<.6){frame=0;phase='neutral before'}else if(cycle>=.6+c.duration){frame=c.frames.length-1;phase=c.holdLastFrame?'terminal hold':'neutral after'}else frame=Math.min(c.frames.length-1,Math.floor((cycle-.6)*c.fps))}const f=c.frames[frame],[x,y]=f.cell,a=$('#grid').children[i],ctx=a.querySelector('canvas').getContext('2d');ctx.clearRect(0,0,320,320);const sprite=sprites.get(c.id+':'+frame);ctx.drawImage(sprite.bitmap,sprite.left,sprite.top);if($('#sockets').checked){ctx.strokeStyle='#efc679';ctx.beginPath();ctx.moveTo(f.pivot[0]-7,f.pivot[1]);ctx.lineTo(f.pivot[0]+7,f.pivot[1]);ctx.moveTo(f.pivot[0],f.pivot[1]-7);ctx.lineTo(f.pivot[0],f.pivot[1]+7);ctx.stroke();ctx.strokeStyle='#65dfeb';ctx.beginPath();ctx.arc(f.muzzle[0],f.muzzle[1],3,0,Math.PI*2);ctx.stroke()}a.querySelector('small').textContent=`${phase} · ${frame+1}/${c.frames.length}`;seen.add(c.id+':'+frame);phases.add(phase);trace.push({clip:c.id,frame,phase,time});if(trace.length>10000)trace.shift()}$('#status').textContent=`${$('#action').value} · ${playing?'playing':'paused'} · ${time.toFixed(2)} s`}
function tick(now){if(last!==null&&playing)time+=Math.max(0,now-last)/1000;last=now;draw();requestAnimationFrame(tick)}$('#action').onchange=rebuild;$('#mode').onchange=()=>{time=0;last=null;phases.clear();trace=[]};$('#pause').onclick=()=>{playing=!playing;$('#pause').textContent=playing?'Pause':'Play'};$('#step').onclick=()=>{playing=false;time+=1/clips()[0].fps+.00001;draw()};window.riftCandidate={manifest,setAction(a){$('#action').value=a;rebuild()},get state(){return {time,playing,seen:[...seen],phases:[...phases],trace}}};rebuild();window.riftCandidateReady=true;requestAnimationFrame(tick);
</script></html>
