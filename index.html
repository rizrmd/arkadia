<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Arkadia · Stronghold</title>
<!-- The loading screen is styled here, not in a bundle, so it paints before any script or artwork arrives. -->
<style>
html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#11191e}
#loading-screen{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;background:radial-gradient(ellipse at 50% 40%,#1d2a30 0%,#11191e 70%);color:#eee7d7;font-family:Georgia,serif;transition:opacity .45s ease}
#loading-screen[data-state=done]{opacity:0;pointer-events:none}
.loading-card{width:min(360px,100%);text-align:center}
.loading-card small{display:block;letter-spacing:.32em;font-size:11px;color:#c9a86a}
.loading-card h1{margin:6px 0 22px;font-weight:400;font-size:clamp(28px,8vw,40px);letter-spacing:.02em}
.loading-track{height:6px;border:1px solid #c9a86a66;border-radius:999px;background:#0b1114;overflow:hidden}
.loading-fill{height:100%;background:linear-gradient(90deg,#b8863f,#f2c46b);transform:scaleX(0);transform-origin:0 50%;transition:transform .25s ease-out}
.loading-status{display:flex;justify-content:space-between;gap:12px;margin:10px 0 0;font-size:13px;color:#cfc6b4}
.loading-percent{font-variant-numeric:tabular-nums;color:#f2c46b}
.loading-retry{margin-top:18px;padding:8px 18px;font:inherit;font-size:14px;color:#eee7d7;background:#141c22;border:1px solid #c9a86a;border-radius:999px;cursor:pointer}
#loading-screen[data-state=error] .loading-fill{background:#b5523b}
@media (prefers-reduced-motion:reduce){#loading-screen,.loading-fill{transition:none}}
</style></head><body><div id="app"></div>
<div id="loading-screen" role="progressbar" aria-label="Loading the Stronghold" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="loading-card"><small>ARKADIA</small><h1>Stronghold</h1><div class="loading-track"><div class="loading-fill"></div></div><p class="loading-status"><span class="loading-label">Loading the game</span><span class="loading-percent">0%</span></p></div></div>
<script type="module" src="/src/app/main.ts"></script></body></html>
